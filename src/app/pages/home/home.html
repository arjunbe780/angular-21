<p>Home Page</p>
<div>
  <button>Primary</button>
</div>
<mat-tab-group (selectedTabChange)="getTabindex($event)">
  <mat-tab label="First">
    <input
      type="file"
      class="border border-gray-700 rounded-10"
      (change)="aadharBack($event)"
      accept="image/*"
    />
    <input
      type="file"
      class="border border-gray-700 rounded-10"
      (change)="aadharFront($event)"
      accept="image/*"
    />
  </mat-tab>
  <mat-tab label="Second"> Content 2 </mat-tab>
  <mat-tab label="Third"> Content 3 </mat-tab>
</mat-tab-group>
